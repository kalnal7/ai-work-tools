name: DOCULENS tests
on:
  push:
    paths: ["doculens/**", ".github/workflows/doculens-tests.yml"]
  pull_request:
    paths: ["doculens/**", ".github/workflows/doculens-tests.yml"]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: doculens/requirements.txt
      - uses: actions/cache@v4
        with:
          path: doculens/tools/tessdata
          key: tessdata-best-e12c65a915945e4c28e237a9b52bc4a8f39a0cec
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: python doculens/setup_models.py
      - run: python -m pip install -r doculens/requirements.txt
      - run: python -m pytest doculens/test_app.py doculens/test_product_workflow.py doculens/test_invoice_parser.py doculens/test_document_reader.py -q -p no:cacheprovider
  browser-e2e:
    if: ${{ vars.RUN_BROWSER_E2E == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: doculens/tools/tessdata
          key: tessdata-best-e12c65a915945e4c28e237a9b52bc4a8f39a0cec
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - run: python doculens/setup_models.py
      - run: python -m pip install -r doculens/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest doculens/test_doculens_browser.py -q -p no:cacheprovider
